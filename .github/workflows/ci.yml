name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  python-ci:
    name: Python validation and model training
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        run: |
          python -m py_compile app.py data_fetch.py train.py

      - name: Import application modules
        run: |
          python -c "import app; print('Flask app imported successfully')"

      - name: Generate dataset and train model
        run: |
          python data_fetch.py
          python train.py

      - name: Check trained model artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ac_brand_model.joblib')
          if not path.exists():
              raise SystemExit('ac_brand_model.joblib is missing')
          print('Model file is present')
          PY

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: python-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: |
          docker build --tag ac-brand-recommender:ci .

  deploy-local:
    name: Deploy to localhost for smoke test
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run container in background
        run: |
          docker run -d --name ac-brand-recommender-ci -p 5000:5000 ac-brand-recommender:ci

      - name: Wait for app startup
        run: |
          for i in {1..15}; do
            if curl --fail http://127.0.0.1:5000 >/dev/null 2>&1; then
              echo 'App is running'
              exit 0
            fi
            sleep 2
          done
          echo 'App did not start in time'
          docker logs ac-brand-recommender-ci || true
          exit 1

      - name: Smoke test HTTP endpoint
        run: |
          curl --fail -o /tmp/health.html http://127.0.0.1:5000
          grep -q 'AC Brand Recommender' /tmp/health.html

      - name: Stop and remove container
        if: always()
        run: |
          docker rm -f ac-brand-recommender-ci
